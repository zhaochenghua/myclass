<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>上课投屏平台</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <section class="join-view" id="joinView">
        <h1 id="pageTitle">宁波三中上课投屏平台</h1>
        <div class="code-panel">
          <div class="code-main">
            <div class="code-left">
              <div class="code-label">课堂连接码</div>
              <div class="code-value" id="roomCode">----</div>
            </div>
            <div class="code-right">
              <img class="qr-code" id="apkQr" alt="APP 下载二维码">
              <div class="download-hint">请扫描二维码安装APP</div>
              <a class="download-apk-btn" id="downloadApkButton" hidden>点击下载安卓APP</a>
              <a class="download-windows-btn" id="downloadWindowsButton" hidden>下载 Windows 投屏程序</a>
              <div class="platform-note">支持安卓/鸿蒙和 Windows 平台</div>
            </div>
          </div>
          <div class="code-actions">
            <button class="action-btn action-btn-teach" id="directTeachButton">打开课件</button>
            <button class="action-btn action-btn-blackboard" id="quickBlackboardButton">电子黑板</button>
            <a class="action-btn action-btn-exam" href="https://teacher.chenji100.com/login" target="_blank" rel="noopener">晨计平台</a>
            <a class="action-btn action-btn-admin" href="./admin.html">后台管理</a>
            <button class="action-btn action-btn-fullscreen" id="homeFullscreenButton">全屏</button>
          </div>
        </div>
        <div class="status-text" id="statusText">正在创建课堂...</div>
        <div class="user-row">
          <span class="direct-teach-user" id="directTeachUser" hidden></span>
          <button class="direct-teach-logout" id="directTeachLogout" hidden>退出</button>
        </div>
        <div class="maintenance-note">由宁波三中人工智能实验室开发维护</div>
      </section>

      <!-- 课件选择弹窗 -->
      <div class="modal-overlay" id="coursewarePicker" hidden>
        <div class="modal-card courseware-picker-card">
          <h3>选择课件</h3>
          <div class="courseware-grid" id="coursewareGrid"></div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="closePickerButton">取消</button>
          </div>
        </div>
      </div>

      <!-- 登录弹窗 -->
      <div class="modal-overlay" id="loginModal" hidden>
        <div class="modal-card">
          <h3>教师登录</h3>
          <form id="teacherLoginForm">
            <label>
              <span>用户名</span>
              <input type="text" id="teacherUsername" required autocomplete="username">
            </label>
            <label>
              <span>密码</span>
              <input type="password" id="teacherPassword" required>
            </label>
            <p class="form-error" id="teacherLoginError" hidden></p>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" id="teacherLoginCancel">取消</button>
              <button type="submit" class="btn-primary" id="teacherLoginSubmit">登录</button>
            </div>
          </form>
          <p class="form-hint">没有账号？请用管理员后台注册。</p>
        </div>
      </div>

      <section class="video-view" id="videoView" hidden>
        <video id="remoteVideo" autoplay playsinline muted></video>
        <canvas class="courseware-canvas" id="coursewareCanvas" hidden></canvas>
        <canvas class="annotation-canvas" id="annotationCanvas"></canvas>
        <div class="annotation-eraser-cursor" id="annotationEraserCursor"></div>
        <div class="annotation-toolbar" id="annotationToolbar" aria-label="画笔工具">
          <button class="annotation-mode" id="panToolButton" type="button" title="手型" aria-label="手型" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
          </button>
          <button class="annotation-button annotation-eraser-btn" id="annotationEraserButton" type="button">板擦</button>
          <div class="annotation-colors-dropdown" id="annotationColorsDropdown">
            <div class="annotation-colors" id="annotationColors" aria-label="画笔颜色">
              <button class="annotation-color" type="button" data-color="#ffd166" aria-label="黄色"></button>
              <button class="annotation-color is-active" type="button" data-color="#ff4d6d" aria-label="红色"></button>
              <button class="annotation-color" type="button" data-color="#38bdf8" aria-label="蓝色"></button>
              <button class="annotation-color" type="button" data-color="#22c55e" aria-label="绿色"></button>
              <button class="annotation-color" type="button" data-color="#ffffff" aria-label="白色"></button>
            </div>
            <div class="toolbar-dropdown-menu annotation-mode-menu" id="annotationModeMenu">
              <button class="toolbar-dropdown-item" type="button" data-mode="solid" title="实线" aria-label="实线">
                <svg viewBox="0 0 48 12" width="48" height="12" aria-hidden="true"><line x1="4" y1="6" x2="44" y2="6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
              </button>
              <button class="toolbar-dropdown-item" type="button" data-mode="dashed" title="虚线" aria-label="虚线">
                <svg viewBox="0 0 48 12" width="48" height="12" aria-hidden="true"><line x1="4" y1="6" x2="44" y2="6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/></svg>
              </button>
              <button class="toolbar-dropdown-item" type="button" data-mode="dashdot" title="点划线" aria-label="点划线">
                <svg viewBox="0 0 48 12" width="48" height="12" aria-hidden="true"><line x1="4" y1="6" x2="44" y2="6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 4 0.5 4"/></svg>
              </button>
              <button class="toolbar-dropdown-item" type="button" data-mode="highlighter" title="荧光笔" aria-label="荧光笔">
                <svg viewBox="0 0 48 12" width="48" height="12" aria-hidden="true"><line x1="4" y1="6" x2="44" y2="6" stroke="currentColor" stroke-width="9" stroke-linecap="round" opacity="0.5"/></svg>
              </button>
            </div>
          </div>
          <button class="annotation-button line-toggle-btn" id="annotationLineToggle" type="button" title="直线/曲线切换" aria-label="直线/曲线切换">直线</button>
          <button class="annotation-button" id="undoAnnotationButton" type="button">撤销</button>
          <button class="annotation-button" id="clearAnnotationButton" type="button">清空</button>
          <div class="toolbar-divider"></div>
          <button class="nav-page-button" id="prevPageButton" type="button" hidden>上一页</button>
          <button class="nav-page-button" id="nextPageButton" type="button" hidden>下一页</button>
          <div class="toolbar-dropdown" id="coursewareDropdown" hidden>
            <button class="annotation-button toolbar-dropdown-btn" id="coursewareMenuButton" type="button">课件</button>
            <div class="toolbar-dropdown-menu" id="coursewareDropdownMenu">
              <button class="toolbar-dropdown-item" id="downloadOriginalMenuItem">↓原文件</button>
              <button class="toolbar-dropdown-item" id="switchCoursewareMenuItem">切换课件</button>
            </div>
          </div>
          <div class="toolbar-divider"></div>
          <button class="annotation-button" id="rollStudentButton" type="button">抽学号</button>
          <span class="roll-student-result" id="rollStudentResult">??</span>
          <div class="toolbar-divider"></div>
          <button class="annotation-button" id="annotationFullscreenButton" type="button">全屏</button>
          <button class="annotation-button blackboard-toggle-btn" id="blackboardToggleButton" type="button">黑板</button>
        </div>
        <div class="video-status" id="videoStatus">等待教师连接...</div>
        <span class="relay-badge" id="relayBadge" hidden>中继模式</span>
        <div class="roll-student-big" id="rollStudentBig" aria-hidden="true"><div class="roll-student-big-bg"></div><span class="roll-student-big-num">??</span></div>
      </section>

      <!-- 视频播放器覆盖层 -->
      <div class="video-player-overlay" id="videoPlayerOverlay" hidden>
        <video id="coursewareVideo" playsinline></video>
        <div class="video-controls" id="videoControls">
          <button class="video-ctrl-btn" id="videoPlayPause" title="播放/暂停">▶</button>
          <div class="video-progress-container" id="videoProgressContainer">
            <div class="video-progress-track" id="videoProgressTrack">
              <div class="video-progress-fill" id="videoProgressFill"></div>
              <div class="video-progress-thumb" id="videoProgressThumb"></div>
            </div>
          </div>
          <span class="video-time" id="videoTime">0:00 / 0:00</span>
          <div class="video-volume-container">
            <button class="video-ctrl-btn" id="videoMuteBtn" title="静音">🔊</button>
            <input type="range" class="video-volume-slider" id="videoVolumeSlider" min="0" max="100" value="100">
          </div>
          <button class="video-ctrl-btn" id="videoFullscreenBtn" title="全屏">⛶</button>
          <button class="video-ctrl-btn" id="videoCloseBtn" title="关闭视频">✕</button>
        </div>
      </div>

      <!-- 设置人数模态框 -->
      <div class="modal-overlay" id="studentCountModal" hidden>
        <div class="modal-card student-count-card">
          <h3>设置班级人数</h3>
          <div class="student-count-display" id="studentCountDisplay">50</div>
          <div class="student-count-steppers">
            <button type="button" class="student-count-step" id="studentCountMinus10" aria-label="减少10">−10</button>
            <button type="button" class="student-count-step" id="studentCountMinus1" aria-label="减少1">−</button>
            <button type="button" class="student-count-step student-count-step-plus" id="studentCountPlus1" aria-label="增加1">＋</button>
            <button type="button" class="student-count-step student-count-step-plus" id="studentCountPlus10" aria-label="增加10">＋10</button>
          </div>
          <div class="student-count-slider" id="studentCountSlider">
            <div class="student-count-fill" id="studentCountFill"></div>
            <div class="student-count-thumb" id="studentCountThumb"></div>
          </div>
          <p class="student-count-hint">拖动滑块或点按 ± 按钮调整人数</p>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="studentCountCancel">取消</button>
            <button type="button" class="btn-primary" id="studentCountConfirm">确定</button>
          </div>
        </div>
      </div>

      <!-- 黑板全屏覆盖层 -->
      <div class="blackboard-overlay" id="blackboardOverlay" hidden>
        <canvas class="blackboard-canvas" id="blackboardCanvas"></canvas>
        <div class="blackboard-eraser-cursor" id="blackboardEraserCursor"></div>
        <div class="blackboard-toolbar">
          <button class="annotation-button" id="blackboardPrevPageButton" type="button">上一页</button>
          <span class="blackboard-page-indicator" id="blackboardPageIndicator">第 1 / 1 页</span>
          <button class="annotation-button" id="blackboardNextPageButton" type="button">下一页</button>
          <div class="toolbar-divider"></div>
          <button class="annotation-button" id="blackboardUndoButton" type="button">撤销</button>
          <button class="annotation-button" id="blackboardClearButton" type="button">清屏</button>
          <button class="annotation-button blackboard-eraser-btn" id="blackboardEraserButton" type="button">板擦</button>
          <button class="annotation-button blackboard-hand-btn" id="blackboardHandButton" type="button" title="手型" aria-label="手型">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
          </button>
          <button class="annotation-button blackboard-select-btn" id="blackboardSelectButton" type="button">圈选</button>
          <button class="annotation-button blackboard-delete-sel-btn" id="blackboardDeleteSelButton" type="button" style="display:none">删除</button>
          <div class="toolbar-divider"></div>
          <div class="annotation-colors-dropdown" id="blackboardColorsDropdown">
            <div class="annotation-colors" id="blackboardColors" aria-label="黑板颜色">
              <button class="annotation-color" type="button" data-color="#ffd166" aria-label="黄色"></button>
              <button class="annotation-color is-active" type="button" data-color="#ff4d6d" aria-label="红色"></button>
              <button class="annotation-color" type="button" data-color="#38bdf8" aria-label="蓝色"></button>
              <button class="annotation-color" type="button" data-color="#22c55e" aria-label="绿色"></button>
              <button class="annotation-color" type="button" data-color="#ffffff" aria-label="白色"></button>
            </div>
            <div class="toolbar-dropdown-menu annotation-mode-menu" id="blackboardModeMenu">
              <button class="toolbar-dropdown-item" type="button" data-mode="solid" title="实线" aria-label="实线">
                <svg viewBox="0 0 48 12" width="48" height="12" aria-hidden="true"><line x1="4" y1="6" x2="44" y2="6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
              </button>
              <button class="toolbar-dropdown-item" type="button" data-mode="dashed" title="虚线" aria-label="虚线">
                <svg viewBox="0 0 48 12" width="48" height="12" aria-hidden="true"><line x1="4" y1="6" x2="44" y2="6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/></svg>
              </button>
              <button class="toolbar-dropdown-item" type="button" data-mode="dashdot" title="点划线" aria-label="点划线">
                <svg viewBox="0 0 48 12" width="48" height="12" aria-hidden="true"><line x1="4" y1="6" x2="44" y2="6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 4 0.5 4"/></svg>
              </button>
              <button class="toolbar-dropdown-item" type="button" data-mode="highlighter" title="荧光笔" aria-label="荧光笔">
                <svg viewBox="0 0 48 12" width="48" height="12" aria-hidden="true"><line x1="4" y1="6" x2="44" y2="6" stroke="currentColor" stroke-width="9" stroke-linecap="round" opacity="0.5"/></svg>
              </button>
            </div>
          </div>
          <button class="annotation-button line-toggle-btn" id="blackboardLineToggle" type="button" title="直线/曲线切换" aria-label="直线/曲线切换">直线</button>
          <div class="toolbar-divider"></div>
          <button class="annotation-button" id="blackboardNewPageButton" type="button">+新页</button>
          <button class="annotation-button" id="blackboardDelPageButton" type="button">删页</button>
          <div class="toolbar-divider"></div>
          <button class="annotation-button" id="blackboardCloseButton" type="button">关闭黑板</button>
        </div>
      </div>

      <!-- 角度/长度指示器：置于 videoView 与 blackboardOverlay 同级，确保黑板模式下也能显示 -->
      <div class="angle-indicator" id="angleIndicator"><span id="angleValue">0°</span><span class="angle-sep">·</span><span id="lengthValue">0px</span></div>
    </main>

    <!-- 左上角当前时间 -->
    <div class="clock-indicator" id="clockIndicator">
      <span class="clock-time" id="clockTime">--:--</span>
    </div>

    <!-- 右上角连接码（始终可见） -->
    <div class="courseware-conn-indicator" id="coursewareConnIndicator">
      <span class="courseware-conn-label">连接码</span>
      <span class="courseware-conn-code" id="coursewareConnCode">----</span>
    </div>

    <script type="module">
      import * as pdfjsLib from './vendor/pdfjs/build/pdf.min.mjs?v=5.4.530';
      window.pdfjsLib = pdfjsLib;
      pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/build/pdf.worker.min.mjs?v=5.4.530';
    </script>
    <script defer src="./app.js?v=20260830a"></script>
  </body>
</html>
