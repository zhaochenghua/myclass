<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>上课投屏平台</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <section class="join-view" id="joinView">
        <h1 id="pageTitle">上课投屏平台</h1>
        <div class="code-panel">
          <div class="code-main">
            <div class="code-left">
              <div class="code-label">课堂连接码</div>
              <div class="code-value" id="roomCode">----</div>
            </div>
            <div class="code-right">
              <img class="qr-code" id="apkQr" alt="APP 下载二维码">
              <div class="download-hint">请扫描二维码安装APP</div>
              <a class="download-apk-btn" id="downloadApkButton" hidden>无法扫码？点击下载APP</a>
              <div class="platform-note">暂只支持安卓/鸿蒙平台</div>
            </div>
          </div>
          <div class="code-actions">
            <button class="action-btn action-btn-teach" id="directTeachButton">直接上课</button>
            <button class="action-btn action-btn-blackboard" id="quickBlackboardButton">黑板</button>
            <a class="action-btn action-btn-exam" href="https://exam.fclassroom.com/login?redirect=%2Fhome" target="_blank" rel="noopener">考试平台</a>
            <button class="action-btn action-btn-exit" id="exitPlatformButton">退出平台</button>
          </div>
        </div>
        <div class="status-text" id="statusText">正在创建课堂...</div>
        <div class="user-row">
          <span class="direct-teach-user" id="directTeachUser" hidden></span>
          <button class="direct-teach-logout" id="directTeachLogout" hidden>退出</button>
        </div>
        <div class="maintenance-note">由宁波三中人工智能实验室开发维护</div>
      </section>

      <!-- 课件选择弹窗 -->
      <div class="modal-overlay" id="coursewarePicker" hidden>
        <div class="modal-card courseware-picker-card">
          <h3>选择课件</h3>
          <div class="courseware-grid" id="coursewareGrid"></div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="closePickerButton">取消</button>
          </div>
        </div>
      </div>

      <!-- 登录弹窗 -->
      <div class="modal-overlay" id="loginModal" hidden>
        <div class="modal-card">
          <h3>教师登录</h3>
          <form id="teacherLoginForm">
            <label>
              <span>用户名</span>
              <input type="text" id="teacherUsername" required autocomplete="username">
            </label>
            <label>
              <span>密码</span>
              <input type="password" id="teacherPassword" required>
            </label>
            <p class="form-error" id="teacherLoginError" hidden></p>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" id="teacherLoginCancel">取消</button>
              <button type="submit" class="btn-primary" id="teacherLoginSubmit">登录</button>
            </div>
          </form>
          <p class="form-hint">没有账号？请用管理员后台注册。</p>
        </div>
      </div>

      <section class="video-view" id="videoView" hidden>
        <video id="remoteVideo" autoplay playsinline muted></video>
        <canvas class="courseware-canvas" id="coursewareCanvas" hidden></canvas>
        <canvas class="annotation-canvas" id="annotationCanvas"></canvas>
        <div class="annotation-toolbar" id="annotationToolbar" aria-label="画笔工具">
          <button class="annotation-mode" id="panToolButton" type="button" hidden>手型</button>
          <div class="annotation-colors" id="annotationColors" aria-label="画笔颜色">
            <button class="annotation-color is-active" type="button" data-color="#ffd166" aria-label="黄色"></button>
            <button class="annotation-color" type="button" data-color="#ff4d6d" aria-label="红色"></button>
            <button class="annotation-color" type="button" data-color="#38bdf8" aria-label="蓝色"></button>
            <button class="annotation-color" type="button" data-color="#22c55e" aria-label="绿色"></button>
            <button class="annotation-color" type="button" data-color="#ffffff" aria-label="白色"></button>
          </div>
          <button class="annotation-button" id="undoAnnotationButton" type="button">撤销</button>
          <button class="annotation-button" id="clearAnnotationButton" type="button">清空</button>
          <div class="toolbar-divider"></div>
          <button class="nav-page-button" id="prevPageButton" type="button" hidden>上一页</button>
          <button class="nav-page-button" id="nextPageButton" type="button" hidden>下一页</button>
          <button class="nav-page-button" id="selectCoursewareButton" type="button" hidden>课件列表</button>
          <button class="annotation-button" id="fullscreenButton" type="button">全屏</button>
          <button class="annotation-button" id="downloadOriginalButton" type="button" hidden>↓原文件</button>
          <div class="toolbar-divider"></div>
          <button class="annotation-button" id="rollStudentButton" type="button">抽学号</button>
          <span class="roll-student-result" id="rollStudentResult">??</span>
          <div class="toolbar-divider"></div>
          <button class="annotation-button blackboard-toggle-btn" id="blackboardToggleButton" type="button">黑板</button>
        </div>
        <div class="video-status" id="videoStatus">等待教师连接...</div>
      </section>

      <!-- 视频播放器覆盖层 -->
      <div class="video-player-overlay" id="videoPlayerOverlay" hidden>
        <video id="coursewareVideo" playsinline></video>
        <div class="video-controls" id="videoControls">
          <button class="video-ctrl-btn" id="videoPlayPause" title="播放/暂停">▶</button>
          <div class="video-progress-container" id="videoProgressContainer">
            <div class="video-progress-track" id="videoProgressTrack">
              <div class="video-progress-fill" id="videoProgressFill"></div>
              <div class="video-progress-thumb" id="videoProgressThumb"></div>
            </div>
          </div>
          <span class="video-time" id="videoTime">0:00 / 0:00</span>
          <div class="video-volume-container">
            <button class="video-ctrl-btn" id="videoMuteBtn" title="静音">🔊</button>
            <input type="range" class="video-volume-slider" id="videoVolumeSlider" min="0" max="100" value="100">
          </div>
          <button class="video-ctrl-btn" id="videoFullscreenBtn" title="全屏">⛶</button>
          <button class="video-ctrl-btn" id="videoCloseBtn" title="关闭视频">✕</button>
        </div>
      </div>

      <!-- 黑板全屏覆盖层 -->
      <div class="blackboard-overlay" id="blackboardOverlay" hidden>
        <canvas class="blackboard-canvas" id="blackboardCanvas"></canvas>
        <div class="blackboard-eraser-cursor" id="blackboardEraserCursor"></div>
        <div class="blackboard-toolbar">
          <button class="annotation-button" id="blackboardPrevPageButton" type="button">上一页</button>
          <span class="blackboard-page-indicator" id="blackboardPageIndicator">第 1 / 1 页</span>
          <button class="annotation-button" id="blackboardNextPageButton" type="button">下一页</button>
          <div class="toolbar-divider"></div>
          <button class="annotation-button" id="blackboardUndoButton" type="button">撤销</button>
          <button class="annotation-button" id="blackboardClearButton" type="button">清屏</button>
          <button class="annotation-button blackboard-eraser-btn" id="blackboardEraserButton" type="button">板擦</button>
          <button class="annotation-button blackboard-hand-btn" id="blackboardHandButton" type="button">手型</button>
          <button class="annotation-button blackboard-select-btn" id="blackboardSelectButton" type="button">圈选</button>
          <button class="annotation-button blackboard-delete-sel-btn" id="blackboardDeleteSelButton" type="button" style="display:none">删除</button>
          <div class="toolbar-divider"></div>
          <div class="annotation-colors" id="blackboardColors" aria-label="黑板颜色">
            <button class="annotation-color is-active" type="button" data-color="#ffd166" aria-label="黄色"></button>
            <button class="annotation-color" type="button" data-color="#ff4d6d" aria-label="红色"></button>
            <button class="annotation-color" type="button" data-color="#38bdf8" aria-label="蓝色"></button>
            <button class="annotation-color" type="button" data-color="#22c55e" aria-label="绿色"></button>
            <button class="annotation-color" type="button" data-color="#ffffff" aria-label="白色"></button>
          </div>
          <div class="toolbar-divider"></div>
          <button class="annotation-button" id="blackboardNewPageButton" type="button">+新页</button>
          <button class="annotation-button" id="blackboardDelPageButton" type="button">删页</button>
          <div class="toolbar-divider"></div>
          <button class="annotation-button" id="blackboardCloseButton" type="button">关闭黑板</button>
        </div>
      </div>
    </main>

    <!-- 右上角连接码（始终可见） -->
    <div class="courseware-conn-indicator" id="coursewareConnIndicator">
      <span class="courseware-conn-label">连接码</span>
      <span class="courseware-conn-code" id="coursewareConnCode">----</span>
    </div>

    <script src="./vendor/pdfjs/build/pdf.min.js"></script>
    <script src="./app.js?v=20260701g"></script>
  </body>
</html>
