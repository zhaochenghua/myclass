<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理后台 - 上课投屏平台</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./admin.css?v=20260919a">
</head>
<body>
  <main class="admin-page">
    <header class="admin-header">
      <h1>管理后台</h1>
      <div class="admin-user" id="adminUser"></div>
      <button class="logout-btn" id="homeButton">回到主页</button>
      <button class="logout-btn" id="logoutButton">退出登录</button>
    </header>

    <!-- 登录面板 -->
    <section class="admin-card" id="loginPanel">
      <h2>管理员登录</h2>
      <form id="loginForm">
        <label>
          <span>用户名</span>
          <input type="text" id="loginUsername" required autocomplete="username">
        </label>
        <label>
          <span>密码</span>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </label>
        <p class="form-error" id="loginError" hidden></p>
        <button type="submit" class="btn-primary">登录</button>
      </form>
      <p class="form-switch">没有账号？<a href="#" id="toRegisterLink">立即注册</a></p>
    </section>

    <!-- 注册面板 -->
    <section class="admin-card" id="registerPanel" hidden>
      <h2>用户注册</h2>
      <form id="registerForm">
        <label>
          <span>用户名（2-20位，中英文数字下划线）</span>
          <input type="text" id="registerUsername" required minlength="2" maxlength="20" autocomplete="username">
        </label>
        <label>
          <span>密码（4-32位）</span>
          <input type="password" id="registerPassword" required minlength="4" maxlength="32" autocomplete="new-password">
        </label>
        <label>
          <span>确认密码</span>
          <input type="password" id="registerConfirmPassword" required minlength="4" maxlength="32" autocomplete="new-password">
        </label>
        <p class="form-error" id="registerError" hidden></p>
        <button type="submit" class="btn-primary">注册</button>
      </form>
      <p class="form-switch">已有账号？<a href="#" id="toLoginLink">返回登录</a></p>
    </section>

    <!-- 主面板（登录后显示） -->
    <section class="admin-main" id="mainPanel" hidden>
      <!-- 标签切换（根据角色动态渲染） -->
      <nav class="admin-tabs" id="adminTabs"></nav>

      <!-- 用户管理（仅管理员可见） -->
      <div class="tab-panel" id="tab-users" hidden>
        <div class="panel-header">
          <h2>用户列表</h2>
          <button class="btn-secondary" id="refreshUsersButton">刷新</button>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th>用户名</th><th>角色</th><th>注册时间</th><th>最后登录</th><th>操作</th></tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 课件管理 -->
      <div class="tab-panel" id="tab-courseware" hidden>
        <div class="panel-header">
          <h2 id="coursewareTitle">课件列表</h2>
          <div class="panel-actions">
            <label class="upload-share-label" id="shareLabel">
              <input type="checkbox" id="uploadShareCheckbox">
              所有人可见
            </label>
            <label class="upload-btn">
              上传课件
              <input type="file" id="coursewareFileInput" accept=".pdf,.ppt,.pptx" hidden>
            </label>
            <button class="btn-secondary" id="refreshCoursewareButton">刷新</button>
          </div>
        </div>
        <div class="upload-progress" id="uploadProgress" hidden>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <span id="progressText">上传中...</span>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th>标题</th><th>文件名</th><th id="ownerTh">所有者</th><th>大小</th><th>上传时间</th><th>操作</th></tr>
            </thead>
            <tbody id="coursewareTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-panel" id="tab-classes" hidden>
        <div class="panel-header">
          <h2>任教班级与学生</h2>
          <button class="btn-secondary" id="refreshClassesButton" type="button">刷新班级</button>
        </div>
        <p class="class-help">名单仅对当前教师可见。上课时可选班级，按姓名或学号抽取；不选班级仍按原来的班级人数抽学号。</p>
        <div class="class-management">
          <aside>
            <form id="createClassForm" class="class-create-form">
              <label for="newClassName">新增任教班级</label>
              <input id="newClassName" maxlength="40" required placeholder="例如：七年级（1）班" autocomplete="off">
              <button class="btn-primary" type="submit">添加班级</button>
            </form>
            <div id="teachingClassList" class="teaching-class-list" aria-label="任教班级列表"></div>
          </aside>
          <div>
            <p id="classEditorEmpty" class="class-help">添加或选择一个班级后，开始录入学生。</p>
            <form id="classEditor" hidden>
              <label for="editClassName">班级名称</label>
              <input id="editClassName" maxlength="40" required autocomplete="off">
              <label for="classRoster">学生名单 <span id="classStudentCount"></span></label>
              <p id="classRosterHelp" class="class-help">每行一位学生，格式为“学号 姓名”。可直接粘贴 Excel 的学号、姓名两列；编辑或删除对应行后点保存。学号可保留前导 0，同班不能重复。</p>
              <textarea id="classRoster" rows="14" maxlength="40000" spellcheck="false" aria-describedby="classRosterHelp" placeholder="01 张三&#10;02 李四&#10;03 王五"></textarea>
              <p class="form-error" id="classEditorError" role="alert" hidden></p>
              <div class="class-editor-actions">
                <button class="btn-primary" id="saveClassButton" type="submit">保存班级与名单</button>
                <button class="btn-danger" id="deleteClassButton" type="button">删除班级</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- 账户设置 -->
      <div class="tab-panel" id="tab-account" hidden>
        <div class="account-sections">
          <!-- 修改密码 -->
          <div class="account-card">
            <h2>修改密码</h2>
            <form id="changePasswordForm">
              <label>
                <span>旧密码</span>
                <input type="password" id="oldPassword" required autocomplete="current-password">
              </label>
              <label>
                <span>新密码（4-32位）</span>
                <input type="password" id="newPassword" required minlength="4" maxlength="32" autocomplete="new-password">
              </label>
              <label>
                <span>确认新密码</span>
                <input type="password" id="confirmPassword" required minlength="4" maxlength="32" autocomplete="new-password">
              </label>
              <p class="form-error" id="changePwError" hidden></p>
              <button type="submit" class="btn-primary">确认修改</button>
            </form>
          </div>

          <!-- 更新个人信息 -->
          <div class="account-card">
            <h2>个人信息</h2>
            <form id="updateProfileForm">
              <label>
                <span>用户名</span>
                <input type="text" id="profileUsername" required minlength="2" maxlength="20" autocomplete="username">
              </label>
              <p class="form-error" id="profileError" hidden></p>
              <button type="submit" class="btn-primary">保存修改</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- 密码重置弹窗（管理员重置他人密码） -->
    <div class="modal-overlay" id="resetModal" hidden>
      <div class="modal-card">
        <h3>重置密码 - <span id="resetUsername"></span></h3>
        <form id="resetPasswordForm">
          <input type="hidden" id="resetUserId">
          <label>
            <span>新密码（4-32位）</span>
            <input type="password" id="resetPasswordInput" required minlength="4" maxlength="32">
          </label>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="resetPasswordCancel">取消</button>
            <button type="submit" class="btn-primary" id="resetPasswordSubmit">确定重置</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 课件重命名弹窗 -->
    <div class="modal-overlay" id="renameModal" hidden>
      <div class="modal-card">
        <h3>重命名课件</h3>
        <form id="renameForm">
          <input type="hidden" id="renameCoursewareId">
          <label>
            <span>新标题</span>
            <input type="text" id="renameCoursewareTitle" required maxlength="100" autocomplete="off">
          </label>
          <p class="form-error" id="renameError" hidden></p>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="renameCancel">取消</button>
            <button type="submit" class="btn-primary" id="renameSubmit">确定</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 全局提示 Toast -->
    <div class="toast-container" id="toastContainer"></div>
  </main>

  <script src="./studentRoster.js?v=20260919a"></script>
  <script src="./admin.js?v=20260919a"></script>
</body>
</html>
