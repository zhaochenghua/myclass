<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理后台 - 上课投屏平台</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <main class="admin-page">
    <header class="admin-header">
      <h1>管理后台</h1>
      <div class="admin-user" id="adminUser"></div>
      <button class="logout-btn" id="logoutButton">退出登录</button>
    </header>

    <!-- 登录面板 -->
    <section class="admin-card" id="loginPanel">
      <h2>管理员登录</h2>
      <form id="loginForm">
        <label>
          <span>用户名</span>
          <input type="text" id="loginUsername" required autocomplete="username">
        </label>
        <label>
          <span>密码</span>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </label>
        <p class="form-error" id="loginError" hidden></p>
        <button type="submit" class="btn-primary">登录</button>
      </form>
    </section>

    <!-- 主面板（登录后显示） -->
    <section class="admin-main" id="mainPanel" hidden>
      <!-- 标签切换 -->
      <nav class="admin-tabs">
        <button class="tab-btn is-active" data-tab="users">用户管理</button>
        <button class="tab-btn" data-tab="courseware">课件管理</button>
      </nav>

      <!-- 用户管理 -->
      <div class="tab-panel is-active" id="tab-users">
        <div class="panel-header">
          <h2>用户列表</h2>
          <button class="btn-primary" id="refreshUsersButton">刷新</button>
        </div>
        <table class="data-table">
          <thead>
            <tr><th>用户名</th><th>注册时间</th><th>最后登录</th><th>操作</th></tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>

      <!-- 课件管理 -->
      <div class="tab-panel" id="tab-courseware" hidden>
        <div class="panel-header">
          <h2>课件列表</h2>
          <div class="panel-actions">
            <label class="upload-share-label">
              <input type="checkbox" id="uploadShareCheckbox">
              所有人可见
            </label>
            <label class="upload-btn">
              上传课件
              <input type="file" id="coursewareFileInput" accept=".pdf,.ppt,.pptx" hidden>
            </label>
            <button class="btn-secondary" id="refreshCoursewareButton">刷新</button>
          </div>
        </div>
        <div class="upload-progress" id="uploadProgress" hidden>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <span id="progressText">上传中...</span>
        </div>
        <table class="data-table">
          <thead>
            <tr><th>标题</th><th>文件名</th><th>所有者</th><th>大小</th><th>上传时间</th><th>操作</th></tr>
          </thead>
          <tbody id="coursewareTableBody"></tbody>
        </table>
      </div>
    </section>
    <!-- 密码重置弹窗 -->
    <div class="modal-overlay" id="resetModal" hidden>
      <div class="modal-card">
        <h3>重置密码 - <span id="resetUsername"></span></h3>
        <form id="resetPasswordForm">
          <input type="hidden" id="resetUserId">
          <label>
            <span>新密码（4-32位）</span>
            <input type="password" id="resetPasswordInput" required minlength="4" maxlength="32">
          </label>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="resetPasswordCancel">取消</button>
            <button type="submit" class="btn-primary" id="resetPasswordSubmit">确定重置</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="./admin.js"></script>
</body>
</html>
