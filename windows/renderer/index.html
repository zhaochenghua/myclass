<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyClass 投屏</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="card" id="setupCard">
        <div class="section-heading">
          <h2>连接教室</h2>
          <div class="heading-actions">
            <button class="icon-button" id="settingsButton" type="button" title="设置服务器地址">⚙</button>
            <span class="status-dot" id="statusDot"></span>
          </div>
        </div>
        <label class="field">
          <span>课堂连接码</span>
          <input id="roomCode" class="room-code" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="输入大屏上的 4 位数字" autocomplete="off">
        </label>
        <label class="field">
          <span>投屏来源</span>
          <div class="source-row">
            <select id="sourceSelect">
              <option value="">正在读取显示器和应用...</option>
            </select>
            <button class="refresh-button" id="refreshSourcesButton" type="button" title="刷新显示器和应用窗口">刷新</button>
          </div>
        </label>
        <label class="check-row">
          <input id="localAudioOutput" type="checkbox" checked>
          <span>投屏时在笔记本电脑上同时播放声音</span>
        </label>
        <p class="hint">可选择整个显示器或单个应用窗口。窗口关闭后会自动停止投屏。取消勾选本机声音后，投屏时会暂时静音笔记本默认播放设备；停止投屏时自动恢复。</p>
        <button class="primary-button" id="startButton" type="button">开始投屏</button>
      </section>

      <section class="card live-card" id="liveCard" hidden>
        <div class="live-header">
          <div>
            <p class="eyebrow">LIVE</p>
            <h2>正在投屏</h2>
          </div>
          <span class="live-badge" id="liveBadge">连接中</span>
        </div>
        <video id="localPreview" class="local-preview" autoplay muted playsinline></video>
        <dl class="stats">
          <div><dt>连接码</dt><dd id="liveCode">----</dd></div>
          <div><dt>视频</dt><dd id="videoStatus">准备中</dd></div>
          <div><dt>声音</dt><dd id="audioStatus">准备中</dd></div>
        </dl>
        <div class="live-actions">
          <button class="secondary-button" id="localAudioButton" type="button">关闭电脑声音</button>
          <button class="danger-button" id="stopButton" type="button">停止投屏</button>
        </div>
      </section>

      <section class="source-dialog" id="settingsDialog" hidden>
        <div class="source-dialog-card" role="dialog" aria-modal="true" aria-labelledby="settingsDialogTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">SETTINGS</p>
              <h2 id="settingsDialogTitle">设置</h2>
            </div>
            <button class="icon-button" id="closeSettingsButton" type="button" title="关闭">×</button>
          </div>
          <label class="field">
            <span>服务器地址</span>
            <input id="settingsServerUrl" type="url" value="http://10.30.13.1/myclass" spellcheck="false">
          </label>
          <p class="hint">保存后下次开始投屏时生效。</p>
          <div class="source-dialog-actions">
            <button class="secondary-button" id="cancelSettingsAction" type="button">取消</button>
            <button class="primary-button" id="saveSettingsButton" type="button">保存</button>
          </div>
        </div>
      </section>

      <section class="source-dialog" id="sourceSwitchDialog" hidden>
        <div class="source-dialog-card" role="dialog" aria-modal="true" aria-labelledby="sourceDialogTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">SOURCE</p>
              <h2 id="sourceDialogTitle">切换投屏窗口</h2>
            </div>
            <button class="icon-button" id="cancelSourceSwitchButton" type="button" title="取消">×</button>
          </div>
          <label class="field">
            <span>选择显示器或应用窗口</span>
            <div class="source-row">
              <select id="switchSourceSelect">
                <option value="">正在读取显示器和应用...</option>
              </select>
              <button class="refresh-button" id="refreshSwitchSourcesButton" type="button" title="刷新显示器和应用窗口">刷新</button>
            </div>
          </label>
          <p class="hint" id="sourceSwitchMessage">切换时连接码和教室连接保持不变。</p>
          <div class="source-dialog-actions">
            <button class="secondary-button" id="cancelSourceSwitchAction" type="button">取消</button>
            <button class="primary-button" id="confirmSourceSwitchButton" type="button">切换窗口</button>
          </div>
        </div>
      </section>

      <p class="status-message" id="statusMessage" role="status">正在初始化...</p>
      <p class="footer-note">关闭窗口会继续在系统托盘运行。点击或右键托盘图标可切换投屏窗口、停止投屏或退出程序。</p>
      <p class="footer-note credit">本软件由宁波三中机器人AI实验室开发维护</p>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
