# coturn TURN 服务器配置 — 用于校园网跨子网 WebRTC 中继
# 部署在 10.30.13.1 上，解决不同路由器下 NAT 穿透问题

# 监听地址（服务器实际网卡 IP）
listening-ip=192.168.50.241
# 对外宣告的 IP（路由器 DMZ 的公网地址）
external-ip=10.30.13.1

# 监听端口
listening-port=3478
# 同时开启 TLS 端口（可选）
tls-listening-port=5349

# 中继端口范围（至少开 10000 个端口用于每个连接）
min-port=49152
max-port=65535

# 认证域：coturn LT 认证必须显式指定 realm，否则所有凭据校验失败（启动日志有 CONFIGURATION ALERT）
# WebRTC 客户端会自动从服务器 401 响应中获取 realm 参与认证计算，无需在客户端配置
realm=10.30.13.1

# 长期认证凭证
user=myclass:myclass2026turn

# 使用长期凭证机制
lt-cred-mech

# 日志
log-file=/var/log/turnserver.log
verbose

# 不开启指纹（兼容性更好）
no-stun-backward-compatibility

# 安全：只允许私有地址的 Peer（校园网内）
no-multicast-peers

# 解除默认会话带宽限制（coturn 默认约 500 kbps/会话，无法承载投屏视频码率）
# 视频投屏码率可达 12~25 Mbps，按 50 Mbps/会话 预留余量
max-bps=50000000

# 并发配额保护，防止中继被占满
total-quota=200
user-quota=32
